[tool.ruff]
line-length=110
target-version="py311"

[tool.ruff.lint]
# Default ruleset (E4/E7/E9/F) plus explicit pycodestyle whitespace rules,
# minus the ones that conflict with the team's no-space-around-operators
# house style (see CLAUDE.md §0.7). ruff check only — never ruff format.
select=["E", "F", "W"]
ignore=[
    "E225",  # missing whitespace around operator      (x=1, a==b   -- intentional)
    "E226",  # missing whitespace around arithmetic op
    "E231",  # missing whitespace after ','             (not actually hit, kept for safety)
    "E251",  # unexpected spaces around keyword / default equals (def f(a=2) -- intentional)
    "E252",
]

[tool.mypy]
python_version="3.11"
ignore_missing_imports=true
disallow_untyped_defs=false
warn_unused_ignores=true

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
