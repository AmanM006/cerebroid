services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vbx}:${POSTGRES_PASSWORD:-vbx}@db:5432/${POSTGRES_DB:-vbx}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (see .env.example)}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vbx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vbx}
      POSTGRES_DB: ${POSTGRES_DB:-vbx}
    ports:
      # bound to localhost only, for running migrations/tests from the host
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vbx}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
