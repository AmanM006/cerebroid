repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # check only -- never the `ruff-format` hook, it would rewrite the
      # team's intentional no-space-around-operators style.
      - id: ruff
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/
