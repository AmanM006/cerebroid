# Same-origin front door: static app + reverse proxy to the API.
# nginx drops server-level add_header lines in any location that sets its own,
# so the security headers live in one snippet included by every location.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Only small JSON bodies are accepted anywhere today.
    client_max_body_size 1m;

    location /api/ {
        include /etc/nginx/conf.d/security_headers.inc;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MRI uploads (five NIfTI files): the API enforces the per-file and total limits itself.
    location = /api/v1/studies {
        include /etc/nginx/conf.d/security_headers.inc;
        client_max_body_size 150m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        include /etc/nginx/conf.d/security_headers.inc;
        proxy_pass http://api:8000;
    }

    location = /ready {
        include /etc/nginx/conf.d/security_headers.inc;
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        include /etc/nginx/conf.d/security_headers.inc;
        proxy_pass http://api:8000;
    }

    # Hashed build files never change, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all serve the app shell, which is never cached.
    location / {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
